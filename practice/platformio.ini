; PlatformIO Project Configuration File
; 蓝桥杯嵌入式练习工程（用 F103 板练核心逻辑）
; 真实竞赛板是 CT117E-M4（STM32G431RBT6, Cortex-M4 170MHz）
; F103 与 G431 的 HAL API 基本同构，练 GPIO/UART/TIM/ADC/LCD 逻辑可无缝迁移，
; 迁移时主要改：时钟树（G4 用 HSI16/PLL）、引脚映射、部分寄存器位宽
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; 上传方式：ST-Link（SWD 四线）；没有 ST-Link 改成 serial 走串口 ISP
upload_protocol = stlink

; 串口监视器波特率（调试用，和 uart.c 里 USART1 保持一致）
monitor_speed = 115200

; HAL 库必要宏：USE_HAL_DRIVER 使能 HAL；STM32F103xB 对应 C8T6（64K Flash/20K RAM）
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
