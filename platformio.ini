; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube 

; ---------- FreeRTOS ----------
; 注意：stm32cube 框架虽然自带 FreeRTOS 源码，但 PlatformIO 默认【不会】编译它。
; 需要 extra_scripts 脚本补齐 include 路径并把内核源码纳入编译，
; 之后代码里才能 #include "cmsis_os.h" 并使用 osThreadCreate / osKernelStart。
extra_scripts = pre:add_freertos.py

build_flags =
    -Os                      ; 优化体积，F103C8T6 只有 64K Flash
    -DUSE_FULL_LL_DRIVER    ; 可选：需要 LL 底层库时启用

; ---------- 调试 ----------
debug_tool = stlink
upload_protocol = stlink     ; 用 ST-Link 下载/调试；若用串口下载改成 serial 并注释本行

; 若使用 USB 串口下载（UART1 PA9/PA10），改用下面两行：
; upload_protocol = serial
; upload_port = COMx         ; 改成你的串口号

; 串口监视器波特率（配合 printf 重定向到 USART1）
monitor_speed = 115200

